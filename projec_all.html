                indicator: "ศธจ.นราธิวาส มีแผนพัฒนาการศึกษา แผนปฏิบัติการ และรายงานผลการดำเนินงาน",

            {

                kpiMain: "ตัวชี้วัดที่ 2. ร้อยละของสถานศึกษาที่สนับสนุนกิจกรรมการเรียนรู้ตลอดชีวิตในชุมชน",
                name: "โครงการส่งเสริมการอ่านและการเรียนรู้ตลอดชีวิต",
                target: "นักเรียน นักศึกษา และประชาชนทั่วไป 37,070 คน",
                activities: "1. ส่งเสริมการอ่านในห้องสมุด 13 แห่ง\n2. บ้านหนังสือชุมชน 163 แห่ง\n3. รถโมบาย",
                outcome: "กลุ่มเป้าหมายมีนิสัยรักการอ่าน และได้เรียนรู้อย่างต่อเนื่องตลอดชีวิต",
                indicator: "จำนวนกิจกรรมดำเนินการเสร็จตามแผน ร้อยละ 100",
                budget: 144820,
                agency: "สำนักงานส่งเสริมการเรียนรู้ประจำจังหวัดนราธิวาส"
            }
        ];

        // Helper function to format numbers as Thai Baht currency
        const formatCurrency = (num) => {
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(num);
        };

        // Function to render projects to the DOM
        const renderProjects = (projectsToRender) => {
            const container = document.getElementById('projectsContainer');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            if (projectsToRender.length === 0) {
                container.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            noResults.classList.add('hidden');

            // Group projects by Strategy for better organization
            const groupedByStrategy = projectsToRender.reduce((acc, project) => {
                if (!acc[project.strategy]) {
                    acc[project.strategy] = [];
                }
                acc[project.strategy].push(project);
                return acc;
            }, {});

            let totalBudgetCalc = 0;

            for (const [strategyName, projects] of Object.entries(groupedByStrategy)) {
                // Strategy Header
                const strategyHeader = document.createElement('div');
                // Extract strategy number and name
                const stratParts = strategyName.split(' ');
                const stratBadge = stratParts.slice(0, 2).join(' ');
                const stratTitle = stratParts.slice(2).join(' ');

                strategyHeader.innerHTML = `
                    <div class="flex items-center gap-3 mb-4 mt-8 border-b-2 border-indigo-200 pb-2">
                        <span class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide shadow-sm">${stratBadge}</span>
                        <h2 class="text-xl font-bold text-slate-800">${stratTitle}</h2>
                    </div>
                `;
                container.appendChild(strategyHeader);

                // Render cards for this strategy
                projects.forEach(project => {
                    totalBudgetCalc += project.budget;
                    
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-6 card-hover transition-all duration-300 relative overflow-hidden';
                    
                    // Format text with line breaks
                    const formatText = (text) => text ? text.replace(/\n/g, '<br>') : '-';

                    card.innerHTML = `
                        <!-- Decoration line -->
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        
                        <div class="flex flex-col lg:flex-row justify-between items-start gap-4 mb-4">
                            <div class="w-full lg:w-3/4">
                                <div class="flex items-center gap-2 mb-2 flex-wrap">
                                    <span class="bg-purple-50 text-purple-700 border border-purple-200 text-xs font-semibold px-2.5 py-0.5 rounded-md flex items-center gap-1">
                                        <i class="fa-solid fa-layer-group"></i> ${project.kpiMain.split('.')[0]}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-indigo-900 leading-tight mb-2">${project.name}</h3>
                                <p class="text-sm text-slate-600 flex items-center gap-2">
                                    <i class="fa-solid fa-building text-slate-400 w-4"></i> 
                                    <span class="font-medium text-slate-700">${project.agency}</span>
                                </p>
                            </div>
                            <div class="w-full lg:w-1/4 flex lg:flex-col items-center lg:items-end justify-between lg:justify-start gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <span class="text-xs text-slate-500 font-medium">งบประมาณ</span>
                                <span class="text-xl font-bold text-emerald-600">${formatCurrency(project.budget)}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 border-t border-slate-100 pt-4">
                            
                            <!-- Target & Activities -->
                            <div class="space-y-4">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-2"><i class="fa-solid fa-users text-indigo-400"></i> กลุ่มเป้าหมาย</h4>
                                    <p class="text-sm text-slate-700 bg-slate-50 p-2 rounded-lg">${formatText(project.target)}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-400"></i> กิจกรรมหลัก</h4>
                                    <p class="text-sm text-slate-700">${formatText(project.activities)}</p>
                                </div>
                            </div>

                            <!-- Outcomes & Indicators -->
                            <div class="space-y-4">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-2"><i class="fa-solid fa-lightbulb text-amber-500"></i> ผลลัพธ์ที่คาดหวัง</h4>
                                    <p class="text-sm text-slate-700 bg-orange-50 p-2 rounded-lg border border-orange-100">${formatText(project.outcome)}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-2"><i class="fa-solid fa-chart-line text-blue-500"></i> ตัวชี้วัดและค่าเป้าหมาย</h4>
                                    <p class="text-sm text-slate-700">${formatText(project.indicator)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // Update Stats
            document.getElementById('totalProjects').textContent = projectsToRender.length;
            document.getElementById('totalBudget').textContent = formatCurrency(totalBudgetCalc);
        };

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        const handleSearch = () => {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            // Toggle clear button visibility
            if (searchTerm.length > 0) {
                clearSearchBtn.classList.remove('hidden');
                // Change input styling for active search
                searchInput.classList.remove('bg-opacity-20');
                searchInput.classList.add('bg-white', 'text-gray-900');
            } else {
                clearSearchBtn.classList.add('hidden');
                searchInput.classList.add('bg-opacity-20');
                searchInput.classList.remove('bg-white', 'text-gray-900');
            }

            // Filter logic
            const filteredProjects = projectData.filter(project => {
                const searchableString = `
                    ${project.name} 
                    ${project.agency} 
                    ${project.strategy} 
                    ${project.activities}
                    ${project.target}
                    ${project.kpiMain}
                `.toLowerCase();
                
                return searchableString.includes(searchTerm);
            });

            renderProjects(filteredProjects);
        };

        // Event Listeners
        searchInput.addEventListener('input', handleSearch);
        
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            handleSearch();
            searchInput.focus();
        });

        // Initialize display on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects(projectData);
        });

    </script>
</body>
</html>
